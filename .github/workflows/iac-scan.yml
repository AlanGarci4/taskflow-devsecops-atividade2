name: IaC Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: codigo/iac/infra
          framework: terraform
          skip_check: CKV2_AWS_61,CKV_AWS_145,CKV_AWS_144,CKV2_AWS_5,CKV2_AWS_62,CKV_AWS_382,CKV_AWS_23
          quiet: true

