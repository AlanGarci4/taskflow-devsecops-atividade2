<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>TaskFlow - Tarefas</title>
  </head>
  <body>
    <h1>Minhas tarefas ({{ username }})</h1>

    <form method="get" action="{{ url_for('tasks') }}">
      <input type="text" name="q" placeholder="buscar tarefa" value="{{ search }}">
      <input type="submit" value="Buscar">
    </form>

    <ul>
      {% for task in tasks %}
        <li>
          <b>{{ task['title'] }}</b> - {{ task['description'] }}
          {% if task['done'] %}(feita){% endif %}
        </li>
      {% endfor %}
    </ul>

    <a href="{{ url_for('new_task') }}">Nova tarefa</a> |
    <a href="{{ url_for('logout') }}">Sair</a>
  </body>
</html>
