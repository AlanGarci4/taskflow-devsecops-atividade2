name: DAST

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: DAST ZAP Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build taskflow image
        run: docker build -t taskflow:dast -f codigo/dast/Dockerfile.taskflow .

      - name: Start app container
        run: docker run -d --name taskflow -p 5000:5000 taskflow:dast

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/healthz >/dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          docker logs taskflow
          exit 1

      - name: Run OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://host.docker.internal:5000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json

      - name: Stop container
        if: always()
        run: docker rm -f taskflow || true
