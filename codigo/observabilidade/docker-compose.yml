services:
  app:
    build:
      context: ../..
      dockerfile: codigo/dast/Dockerfile.taskflow
    container_name: taskflow-app-obs
    command: ["python", "codigo/observabilidade/app_instrumented.py"]
    environment:
      TASKFLOW_SECRET_KEY: ${SECRET_KEY}
      FLASK_DEBUG: "false"
    ports:
      - "5000:5000"
    networks:
      - observability

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - observability
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - observability
    depends_on:
      - loki

networks:
  observability:
